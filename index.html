<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXT - Input Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
 body{font-family:Inter,sans-serif;background:#F3F4F6;padding:18px;margin:0}
 #card{background:#fff;border:1px solid #E3E6EA;border-radius:10px;padding:16px;max-width:420px}
 .field{margin-bottom:12px} label{font-size:11px;font-weight:700;color:#5B6472;text-transform:uppercase}
 input,select{width:100%;padding:11px 12px;border:1px solid #E3E6EA;border-radius:7px;font-size:15px}
 #btnSave{width:100%;padding:13px;background:#1D4E89;color:#fff;border:none;border-radius:8px;font-weight:800}
 #barcodeCard{display:none;margin-top:16px;background:#fff;border:2px dashed #1D4E89;border-radius:10px;padding:16px;text-align:center}
 #msg{font-size:12px;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<h1 style="font-size:16px;font-weight:800">EXT - Input Hasil</h1>
<div style="font-size:11px;color:#5B6472;margin-bottom:16px">Input → Simpan → Cetak Barcode Kitir</div>

<div id="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label><select id="fShift"><option value="">- pilih -</option><option>1</option><option>2</option><option>3</option></select></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label>Ext (Line)</label><select id="fExt"><option>EXT1</option><option>EXT2</option><option>EXT3</option><option>EXT4</option></select></div>
    <div class="field"><label>Untuk TF</label><select id="fTf"><option>TF5</option><option>TF6</option><option>TF7</option><option>TF8</option><option>TF9</option><option>TF10</option><option>TF12</option><option>TF13</option><option>TF14</option><option>TF15</option><option>TF16</option></select></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label>Ukuran</label><input id="fUkuran" placeholder="ex: 1.0 x 800"></div>
    <div class="field"><label>Berat (kg)</label><input id="fBerat" type="number" placeholder="kg"></div>
  </div>
  <div class="field"><label>Nama Operator Ext</label><input id="fNama"></div>
  <div class="field"><label>No. Carsheet</label><input id="fCarsheet" placeholder="auto / isi manual"></div>
  <button id="btnSave" onclick="extSimpan()">Simpan & Buat Barcode</button>
  <div id="msg"></div>
  
  <div id="barcodeCard">
    <div style="font-size:11px;color:#5B6472">CARSHEET</div>
    <div id="bCarsheet" style="font-family:Roboto Mono;font-size:22px;font-weight:800;margin:4px 0"></div>
    <svg id="barcode"></svg>
    <div id="bInfo" style="font-size:11px;margin-top:6px"></div>
    <button onclick="window.print()" style="margin-top:10px;width:100%;padding:10px;background:#111827;color:#fff;border:none;border-radius:7px;font-weight:700">🖨️ Cetak Kitir</button>
  </div>
</div>

<script>
var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
function setTanggal(){var d=new Date();document.getElementById('fTanggal').value=d.toISOString().slice(0,10)} setTanggal();
function jamNow(){var n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}

function extSimpan(){
  var tanggal=document.getElementById('fTanggal').value;
  var shift=document.getElementById('fShift').value;
  var ext=document.getElementById('fExt').value;
  var untukTf=document.getElementById('fTf').value;
  var ukuran=document.getElementById('fUkuran').value.trim();
  var berat=document.getElementById('fBerat').value.trim();
  var nama=document.getElementById('fNama').value.trim();
  var carsheet=document.getElementById('fCarsheet').value.trim();
  if(!tanggal||!shift||!ukuran||!berat||!nama||!carsheet){document.getElementById('msg').textContent='Lengkapi semua field';document.getElementById('msg').style.color='red';return;}
  
  var data={_app:'ext',tanggal:tanggal,shift:shift,ext:ext,tf:untukTf,ukuran:ukuran,berat:berat,nama:nama,carsheet:carsheet,jam:jamNow()};
  
  document.getElementById('msg').textContent='Menyimpan...';document.getElementById('msg').style.color='#555';
  
  // simpan ke sheet EXT
  fetch(WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
  .then(r=>r.json()).then(res=>{
    if(res.ok){
      document.getElementById('msg').textContent='Tersimpan';document.getElementById('msg').style.color='green';
      // Generate barcode
      document.getElementById('bCarsheet').textContent=carsheet;
      document.getElementById('bInfo').textContent=ext+' | '+untukTf+' | '+ukuran+' | '+berat+'kg | '+nama;
      JsBarcode("#barcode", carsheet, {format:"CODE128", width:2, height:80, displayValue:false});
      document.getElementById('barcodeCard').style.display='block';
    }else{
      document.getElementById('msg').textContent='Gagal: '+res.error;document.getElementById('msg').style.color='red';
    }
  });
}
</script>
</body>
</html>
