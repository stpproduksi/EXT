<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitir SHEET</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-title" content="Kitir Ext">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{ --bg:#F3F4F6; --card:#FFFFFF; --ink:#14181F; --mute:#5B6472; --line:#E3E6EA; --accent:#1D4E89; --good:#157F3C; --bad:#B91C1C; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:18px; }
  h1{ font-size:16px; font-weight:800; margin:0 0 2px; } .sub{ font-size:11px; color:var(--mute); margin-bottom:16px; }
  #formCard{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:420px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--mute); margin-bottom:5px; }
  .field input, .field select{ width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(29,78,137,.15); }
  .field input:disabled, .field select:disabled{ background:#F3F4F6; color:var(--mute); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn{ width:100%; padding:13px; font-size:14px; font-weight:700; border:none; border-radius:8px; color:#fff; cursor:pointer; margin-top:8px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  #btnSave{ background:var(--accent); margin-top:4px; }
  #btnPrint{ background:#B45309; }
  #btnShareWA{ background:#25D366; }
  #btnReset{ background:#fff; color:var(--mute); border:1px solid var(--line); font-size:12.5px; padding:10px; }
  #msg{ font-size:12.5px; margin-top:10px; min-height:16px; } #msg.ok{ color:var(--good); font-weight:700; } #msg.bad{ color:var(--bad); font-weight:700; }
  #kitirPrintArea{ display:none; }
  .kitir{ width:54mm; margin:0; font-family:'Roboto Mono', monospace; color:#000; padding:0; }
  .kitir .brand{ text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.08em; }
  .kitir .judul{ text-align:center; font-size:11.5px; font-weight:700; margin:1px 0 3px; }
  .kitir hr{ border:none; border-top:1px dashed #000; margin:3px 0; }
  .kitir .ref{ text-align:center; font-size:11px; font-weight:700; margin:1px 0 3px; }
  .kitir .nama{ text-align:center; font-size:12px; font-weight:700; margin:3px 0; word-break:break-word; }
  .kitir .berat-wrap{ text-align:center; margin:4px 0; }
  .kitir .berat-wrap .lbl{ font-size:8.5px; letter-spacing:.08em; }
  .kitir .berat-wrap .val{ font-size:20px; font-weight:700; line-height:1.1; }
  .kitir .rute{ text-align:center; font-size:14px; font-weight:700; margin:3px 0; }
  .kitir .foot{ display:flex; justify-content:space-between; font-size:11px; font-weight:700; margin-top:3px; }
  .kitir .barcode-wrap{ text-align:center; margin-top:5px; }
  .kitir .barcode-wrap svg{ max-width:52mm; height:24mm; }
  @media print{
    body *{ visibility:hidden; }
    #kitirPrintArea, #kitirPrintArea *{ visibility:visible; }
    #kitirPrintArea{ display:block; position:absolute; top:0; left:0; }
    @page{ size:58mm auto; margin:0; }
  }
</style>
</head>
<body>

<h1>Kitir SHEET</h1>
<div class="sub">Input &rarr; simpan EXT &rarr; cetak kitir + barcode</div>

<div id="formCard">
  <div class="field"><label>No. Carsheet</label><input type="text" id="fCarsheet" placeholder="Nomor carsheet"></div>
  <div class="row2">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label><select id="fShift"><option value="">- pilih -</option><option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option></select></div>
  </div>
  <div class="row2">
    <div class="field"><label>Ext</label><select id="fExt"><option value="">- pilih -</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
    <div class="field"><label>Untuk TF</label><select id="fUntukTf"><option value="">- pilih -</option><option>TF04</option><option>TF05</option><option>TF06</option><option>TF07</option><option>TF08</option><option>TF09</option><option>TF10</option><option>TF12</option><option>TF13</option><option>TF14</option><option>TF15</option><option>TF16</option></select></div>
  </div>
  <div class="field"><label>Ukuran</label><select id="fUkuran"><option value="">- memuat daftar -</option></select></div>
  <div class="field"><label>Nama Operator</label><input type="text" id="fNama" placeholder="Nama operator"></div>
  <div class="field"><label>Berat (kg)</label><input type="number" id="fBerat" step="0.01" inputmode="decimal" placeholder="0,00"></div>

  <button id="btnSave" class="btn" onclick="kitirSimpan()">Simpan</button>
  <button id="btnPrint" class="btn" onclick="kitirCetak()" disabled>Cetak</button>
  <button id="btnShareWA" class="btn" onclick="kitirShareWA()" disabled>Share WA</button>
  <button id="btnReset" class="btn" onclick="kitirResetForm()">Kosongkan Form</button>
  <div id="msg"></div>
</div>

<div id="kitirPrintArea">
  <div class="kitir">
    <div class="brand">STP</div>
    <div class="judul">KITIR SHEET</div>
    <div class="ref" id="pCarsheet">No. Carsheet: -</div>
    <hr>
    <div class="nama" id="pUkuran">-</div>
    <div class="berat-wrap"><div class="lbl">BERAT</div><div class="val" id="pBerat">-</div></div>
    <div class="rute" id="pRute">-</div>
    <hr>
    <div class="foot"><span id="pTanggal">-</span><span id="pShift">-</span></div>
    <div class="foot"><span>Operator:</span><span id="pNama">-</span></div>
    <div class="barcode-wrap"><svg id="pBarcode"></svg></div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
}

var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var KITIR_KEY='kitirSaved';
var kitirState=null;   // { data, sid } setelah simpan sukses
var kitirDraft=null;   // { sid, json } untuk retry, supaya tidak ganda

function kitirSetDefaultTanggal(){
  var d=new Date();
  document.getElementById('fTanggal').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
kitirSetDefaultTanggal();

function kitirNewSid(){
  return 'K'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function kitirMuatDaftarUkuran(){
  var selectEl=document.getElementById('fUkuran');
  function tampilkan(res){
    if(!res||!res.ok){ selectEl.innerHTML='<option value="">- gagal memuat -</option>'; return; }
    var opts='<option value="">- pilih -</option>';
    res.items.forEach(function(v){ opts+='<option value="'+String(v).replace(/"/g,'&quot;')+'">'+v+'</option>'; });
    selectEl.innerHTML=opts;
  }
  var inApps=(typeof google!=='undefined'&&google.script&&google.script.run);
  if(inApps){ google.script.run.withSuccessHandler(tampilkan).withFailureHandler(function(){ tampilkan(null); }).kitirGetUkuranList(); return; }
  fetch(WEBAPP_URL+'?action=ukuranList').then(function(r){return r.json();}).then(tampilkan).catch(function(){ tampilkan(null); });
}
kitirMuatDaftarUkuran();

function kitirSetFormLocked(on){
  ['fCarsheet','fTanggal','fShift','fExt','fUntukTf','fUkuran','fNama','fBerat'].forEach(function(id){
    document.getElementById(id).disabled=on;
  });
}

function kitirTampilSudahSimpan(){
  kitirSetFormLocked(true);
  document.getElementById('btnSave').disabled=true;
  document.getElementById('btnPrint').disabled=false;
  document.getElementById('btnShareWA').disabled=false;
}

function kitirJamSekarang(){
  var n=new Date();
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}

function kitirAmbilForm(){
  return {
    carsheet: document.getElementById('fCarsheet').value.trim(),
    tanggal: document.getElementById('fTanggal').value,
    jam: kitirJamSekarang(),
    shift: document.getElementById('fShift').value,
    ext: document.getElementById('fExt').value,
    ukuran: document.getElementById('fUkuran').value.trim(),
    untukTf: document.getElementById('fUntukTf').value,
    berat: document.getElementById('fBerat').value,
    nama: document.getElementById('fNama').value.trim()
  };
}

function kitirValidasi(d){
  if(!d.carsheet) return 'No. Carsheet belum diisi.';
  if(!d.tanggal) return 'Tanggal belum diisi.';
  if(!d.shift) return 'Shift belum dipilih.';
  if(!d.ext) return 'Ext belum dipilih.';
  if(!d.ukuran) return 'Ukuran belum dipilih.';
  if(!d.untukTf) return 'Untuk TF belum dipilih.';
  if(!d.berat||isNaN(parseFloat(d.berat))||parseFloat(d.berat)<=0) return 'Berat belum valid.';
  if(!d.nama) return 'Nama operator belum diisi.';
  return null;
}

function kitirFmtTanggal(iso){ var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }

function kitirIsiPreview(d){
  document.getElementById('pCarsheet').textContent='No. Carsheet: '+d.carsheet;
  document.getElementById('pNama').textContent=d.nama;
  document.getElementById('pUkuran').textContent=d.ukuran;
  document.getElementById('pBerat').textContent=Number(d.berat).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg';
  document.getElementById('pRute').textContent='EXT '+d.ext+' → '+d.untukTf;
  document.getElementById('pTanggal').textContent=kitirFmtTanggal(d.tanggal)+' '+d.jam;
  document.getElementById('pShift').textContent='SHIFT '+d.shift;
  try{
    JsBarcode("#pBarcode", d.carsheet, {format:"CODE128", width:1.6, height:55, displayValue:true, fontSize:11, margin:2});
  }catch(e){
    document.getElementById('pBarcode').innerHTML='';
  }
}

function kitirKirimSimpan(data,onSuccess,onError){
  var inApps=(typeof google!=='undefined'&&google.script&&google.script.run);
  if(inApps){ google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError).kitirSimpanData(data); return; }
  fetch(WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
    .then(function(res){return res.json();}).then(onSuccess).catch(onError);
}

function kitirBuatPesanWA_TextBiasa(d){
  var tgl=kitirFmtTanggal(d.tanggal)+' '+d.jam;
  var berat=Number(d.berat).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
  var pesan="";
  pesan+="LAPORAN EXT\n";
  pesan+="No. Carsheet : "+d.carsheet+"\n";
  pesan+="Tgl : "+tgl+"\n";
  pesan+="Shift : "+d.shift+"\n";
  pesan+="EXT : "+d.ext+" -> "+d.untukTf+"\n";
  pesan+="Ukuran : "+d.ukuran+"\n";
  pesan+="Berat : "+berat+" kg\n";
  pesan+="Operator : "+d.nama+"\n";
  return pesan;
}

function kitirShareKeWA(pesan){ window.open("https://wa.me/?text="+encodeURIComponent(pesan),"_blank"); }

// 1. Simpan ke sheet EXT. Tidak mencetak otomatis, cetak dilakukan dengan tombol Cetak.
function kitirSimpan(){
  var msgEl=document.getElementById('msg');
  if(kitirState){ msgEl.textContent='Data sudah tersimpan. Pakai Cetak, atau Kosongkan Form untuk input baru.'; msgEl.className='bad'; return; }

  var data=kitirAmbilForm();
  var err=kitirValidasi(data);
  if(err){ msgEl.textContent=err; msgEl.className='bad'; return; }

  // Retry dengan data yang sama memakai sid yang sama, supaya backend tidak menulis dua kali
  var json=JSON.stringify(data);
  if(!kitirDraft||kitirDraft.json!==json){ kitirDraft={sid:kitirNewSid(), json:json}; }
  data.sid=kitirDraft.sid;
  var sid=kitirDraft.sid;

  var btn=document.getElementById('btnSave');
  btn.disabled=true; msgEl.textContent='Menyimpan...'; msgEl.className='';

  kitirKirimSimpan(data,function(res){
    if(res&&res.ok){
      kitirState={data:data, sid:sid};
      kitirDraft=null;
      try{ localStorage.setItem(KITIR_KEY, JSON.stringify(kitirState)); }catch(e){}
      kitirIsiPreview(data);
      kitirTampilSudahSimpan();
      msgEl.textContent=(res.duplicate?'Data sudah tersimpan sebelumnya. ':'Tersimpan. ')+'Tekan Cetak jika struk belum keluar.';
      msgEl.className='ok';
    }else{
      btn.disabled=false;
      msgEl.textContent='Gagal: '+(res&&res.error?res.error:'tidak diketahui')+'. Tekan Simpan lagi, data tidak akan ganda.';
      msgEl.className='bad';
    }
  },function(err){
    btn.disabled=false;
    msgEl.textContent='Gagal: '+(err&&err.message?err.message:err)+'. Tekan Simpan lagi, data tidak akan ganda.';
    msgEl.className='bad';
  });
}

// 2. Cetak bisa diulang kapan saja tanpa menyimpan ulang
function kitirCetak(){
  var msgEl=document.getElementById('msg');
  if(!kitirState){ msgEl.textContent='Belum ada data tersimpan.'; msgEl.className='bad'; return; }
  kitirIsiPreview(kitirState.data);
  setTimeout(function(){ window.print(); }, 300);
}

// 3. Share WA memakai data yang sudah tersimpan
function kitirShareWA(){
  var msgEl=document.getElementById('msg');
  if(!kitirState){ msgEl.textContent='Simpan dulu.'; msgEl.className='bad'; return; }
  kitirShareKeWA(kitirBuatPesanWA_TextBiasa(kitirState.data));
  msgEl.textContent='WhatsApp dibuka. Data masih ada di form.'; msgEl.className='ok';
}

// 4. Kosongkan form, satu-satunya cara untuk input baru
function kitirResetForm(){
  kitirState=null;
  kitirDraft=null;
  try{ localStorage.removeItem(KITIR_KEY); }catch(e){}
  ['fCarsheet','fShift','fExt','fUntukTf','fNama','fUkuran','fBerat'].forEach(function(id){
    document.getElementById(id).value='';
  });
  kitirSetDefaultTanggal();
  kitirSetFormLocked(false);
  document.getElementById('btnSave').disabled=false;
  document.getElementById('btnPrint').disabled=true;
  document.getElementById('btnShareWA').disabled=true;
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='';
}

// Saat halaman dibuka ulang, pulihkan status tersimpan dari browser
function kitirPulihkan(){
  var raw=null;
  try{ raw=localStorage.getItem(KITIR_KEY); }catch(e){}
  if(!raw) return;
  try{
    kitirState=JSON.parse(raw);
    kitirIsiPreview(kitirState.data);
    kitirTampilSudahSimpan();
    var msgEl=document.getElementById('msg');
    msgEl.textContent='Ada data tersimpan. Tekan Cetak jika struk belum keluar, atau Kosongkan Form untuk input baru.';
    msgEl.className='ok';
  }catch(e){ kitirState=null; try{ localStorage.removeItem(KITIR_KEY); }catch(_){} }
}
kitirPulihkan();
</script>
</body>
</html>
